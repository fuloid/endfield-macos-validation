name: Validate Wine on macOS

'on':
  workflow_dispatch:
    inputs:
      game_test:
        description: 'Run the Endfield launcher test job (launcher -> Play -> Unity) after the build'
        type: boolean
        default: true
      rebuild:
        description: 'Ignore the cached Wine build and rebuild from source'
        type: boolean
        default: false
  push:
    branches: [ci/macos-validation]
    paths:
      - '.github/workflows/validate-macos.yml'
      - 'scripts/**'
      - 'port/mac-handoff/**'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: macos-wine-validation-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  helpers:
    name: Portable helpers with sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check handoff integrity
        working-directory: port/mac-handoff
        run: sha256sum -c SHA256SUMS
      - name: Compile exact patched helpers and run checks
        run: python3 scripts/test_helpers.py --sanitize --output "$RUNNER_TEMP/helper-results"
      - name: Upload helper evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-helper-results
          path: ${{ runner.temp }}/helper-results
          retention-days: 3
          if-no-files-found: ignore

  macos:
    name: Full Wine build and Rosetta probe
    if: github.event_name == 'workflow_dispatch'
    needs: helpers
    runs-on: macos-15
    timeout-minutes: 240
    env:
      TOOL_BREW: /opt/homebrew/bin/brew
      INTEL_BREW: /usr/local/bin/brew
      JOBS: '2'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
      CC: ccache /usr/bin/clang -arch x86_64
      CXX: ccache /usr/bin/clang++ -arch x86_64
      OBJC: ccache /usr/bin/clang -arch x86_64
      x86_64_CC: ccache x86_64-w64-mingw32-gcc
      CFLAGS: -O2 -g0
      CXXFLAGS: -O2 -g0
      CROSSCFLAGS: -O2 -g0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record environment
        run: |
          export WORK_DIR="$RUNNER_TEMP/wine-validation"
          echo "WORK_DIR=$WORK_DIR" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/wine-ccache" >> "$GITHUB_ENV"
          mkdir -p "$WORK_DIR/diagnostics"
          {
            sw_vers
            uname -a
            xcodebuild -version
            /usr/bin/clang --version
            sysctl hw.memsize hw.ncpu
            df -h "$RUNNER_TEMP"
            git rev-parse HEAD
          } > "$WORK_DIR/diagnostics/environment.txt" 2>&1
          cat "$WORK_DIR/diagnostics/environment.txt"
      - name: Probe GUI session and Metal device
        continue-on-error: true
        run: |
          out="$WORK_DIR/diagnostics/gui-metal"
          mkdir -p "$out"
          cat > "$out/metal.swift" <<'SWIFT'
          import Metal
          guard let d = MTLCreateSystemDefaultDevice() else { print("Metal: no device"); exit(1) }
          print("Metal device: \(d.name)")
          print("lowPower=\(d.isLowPower) headless=\(d.isHeadless) unifiedMemory=\(d.hasUnifiedMemory)")
          for (n, f) in [("apple7", MTLGPUFamily.apple7), ("apple8", .apple8), ("apple9", .apple9),
                         ("mac2", .mac2), ("metal3", .metal3)] { print("supportsFamily(\(n))=\(d.supportsFamily(f))") }
          SWIFT
          {
            echo "== console user / WindowServer"
            stat -f '%Su' /dev/console || true
            pgrep -lx WindowServer || echo "WindowServer not running"
            echo "== displays"
            system_profiler SPDisplaysDataType || true
            echo "== Metal (native arm64)"
            swift "$out/metal.swift" || true
            echo "== Metal (x86_64 under Rosetta)"
            swiftc -target x86_64-apple-macos13 "$out/metal.swift" -o "$out/metal-x86_64" && arch -x86_64 "$out/metal-x86_64" || true
            echo "== screencapture"
            screencapture -x "$out/screen.png" && sips -g pixelWidth -g pixelHeight "$out/screen.png" || echo "screencapture failed"
          } 2>&1 | tee "$out/probe.txt"
      - name: Check handoff integrity
        working-directory: port/mac-handoff
        run: shasum -a 256 -c SHA256SUMS
      - name: Install native tools and Intel runtime libraries
        run: |
          bash scripts/ci-macos-deps.sh 2>&1 | tee "$WORK_DIR/diagnostics/dependencies.log"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          /opt/homebrew/bin/ccache --max-size "$CCACHE_MAXSIZE"
      # The installed Wine depends only on the patches, build-mac.sh (pins the Wine revision
      # and configure flags) and the dependency script; reuse it unless one of them changed.
      - name: Restore cached Wine build
        id: winecache
        if: ${{ !inputs.rebuild }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.WORK_DIR }}/wine-install
          key: wine-install-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('port/mac-handoff/patches/**', 'port/mac-handoff/build-mac.sh', 'scripts/ci-macos-deps.sh') }}
      - name: Report Wine build cache
        run: |
          if [ "${{ steps.winecache.outputs.cache-hit }}" = true ]; then
            echo 'Wine build: reused from cache (patches, build-mac.sh and deps unchanged)' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'Wine build: building from source (inputs changed, no cache, or rebuild requested)' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Restore compiler cache
        if: ${{ !(steps.winecache.outputs.cache-hit == 'true') }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: wine-1119-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: wine-1119-${{ runner.os }}-${{ runner.arch }}-
      - name: Fetch pinned Wine and apply selected patches
        if: ${{ !(steps.winecache.outputs.cache-hit == 'true') }}
        run: bash port/mac-handoff/build-mac.sh prepare
      - name: Test helpers extracted from this Wine tree
        env:
          HOST_CC: /usr/bin/clang
        run: |
          if [ -d "$WORK_DIR/wine-src" ]; then
            python3 scripts/test_helpers.py --source "$WORK_DIR/wine-src" --output "$WORK_DIR/diagnostics/helpers"
          else
            python3 scripts/test_helpers.py --output "$WORK_DIR/diagnostics/helpers"
          fi
      - name: Configure full x86_64 macOS Wine
        if: ${{ !(steps.winecache.outputs.cache-hit == 'true') }}
        run: bash port/mac-handoff/build-mac.sh configure
      - name: Build and install full Wine
        id: build
        if: ${{ !(steps.winecache.outputs.cache-hit == 'true') }}
        run: bash port/mac-handoff/build-mac.sh build
      - name: Save Wine build cache
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.WORK_DIR }}/wine-install
          key: wine-install-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('port/mac-handoff/patches/**', 'port/mac-handoff/build-mac.sh', 'scripts/ci-macos-deps.sh') }}
      - name: Run Wine and instruction probe under Rosetta
        run: python3 scripts/run_macos_smoke.py --work "$WORK_DIR"
      - name: Package installed runtime and provenance
        if: always() && (steps.build.outcome == 'success' || steps.winecache.outputs.cache-hit == 'true')
        run: |
          mkdir -p "$RUNNER_TEMP/wine-artifacts"
          cp port/mac-handoff/PROVENANCE.txt "$WORK_DIR/wine-install/"
          cp -R port/mac-handoff/licenses "$WORK_DIR/wine-install/"
          cp -R port/mac-handoff/patches "$WORK_DIR/wine-install/"
          {
            echo 'Wine source: https://github.com/wine-mirror/wine.git'
            git -C "$WORK_DIR/wine-src" rev-parse HEAD 2>/dev/null || echo '455e3509b98a6919fd4ad1def4803e08c41c03b2 (cached build)'
            echo 'Patch repository commit:'
            git rev-parse HEAD
            cat "$WORK_DIR/diagnostics/environment.txt"
          } > "$WORK_DIR/wine-install/BUILD-INFO.txt"
          tar -czf "$RUNNER_TEMP/wine-artifacts/wine-11.19-macos-x86_64.tar.gz" -C "$WORK_DIR" wine-install
          shasum -a 256 "$RUNNER_TEMP/wine-artifacts/wine-11.19-macos-x86_64.tar.gz" > "$RUNNER_TEMP/wine-artifacts/SHA256SUMS"
      - name: Record final diagnostics
        if: always()
        run: |
          mkdir -p "$WORK_DIR/diagnostics"
          if command -v ccache >/dev/null; then
            ccache --show-stats > "$WORK_DIR/diagnostics/ccache.txt"
          fi
          df -h "$RUNNER_TEMP" > "$WORK_DIR/diagnostics/disk.txt"
          if [ -f "$WORK_DIR/wine-build/config.log" ]; then
            cp "$WORK_DIR/wine-build/config.log" "$WORK_DIR/diagnostics/"
          fi
          if [ -f "$WORK_DIR/wine-build/include/config.h" ]; then
            cp "$WORK_DIR/wine-build/include/config.h" "$WORK_DIR/diagnostics/"
          fi
          if [ -d "$WORK_DIR/wine-install" ]; then
            find "$WORK_DIR/wine-install" -name '*.so' -exec file {} + > "$WORK_DIR/diagnostics/unix-modules.txt"
          fi
          {
            echo '## Wine / Rosetta validation'
            echo 'Scope: compilation and CPU/exception probe; no graphics or game.'
            if [ -f "$WORK_DIR/smoke/smoke.json" ]; then
              cat "$WORK_DIR/smoke/smoke.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save compiler cache
        if: always() && steps.build.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: wine-1119-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-wine-diagnostics
          path: |
            ${{ env.WORK_DIR }}/diagnostics
            ${{ env.WORK_DIR }}/*.log
            ${{ env.WORK_DIR }}/smoke
          retention-days: 3
          if-no-files-found: warn
      - name: Upload compiled Wine runtime
        if: always() && (steps.build.outcome == 'success' || steps.winecache.outputs.cache-hit == 'true')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wine-11.19-macos-x86_64
          path: ${{ runner.temp }}/wine-artifacts
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  endfield:
    name: Endfield launcher test (informational)
    # Separate, fresh runner so the build does not compete with the launcher + game for memory.
    if: github.event_name == 'workflow_dispatch' && inputs.game_test && needs.macos.result == 'success'
    needs: macos
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    env:
      SAMPLE_URL: https://s.purin.my/akef/endfield-ci-sample.tar.xz
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare (runtime libraries, Wine runtime, sample)
        id: prepare
        continue-on-error: true
        run: |
          export WORK_DIR="$RUNNER_TEMP/endfield"
          echo "WORK_DIR=$WORK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$WORK_DIR/game-smoke"
          vm_stat | tee "$WORK_DIR/game-smoke/vm_stat-before-prepare.txt"
          bash scripts/ci-macos-deps.sh > "$WORK_DIR/game-smoke/dependencies.log" 2>&1
          gh run download "$GITHUB_RUN_ID" -n wine-11.19-macos-x86_64 -D "$WORK_DIR/runtime"
          (cd "$WORK_DIR/runtime" && sed "s|  .*/|  |" SHA256SUMS | shasum -a 256 -c -)
          tar -xzf "$WORK_DIR/runtime/wine-11.19-macos-x86_64.tar.gz" -C "$WORK_DIR"
          rm -f "$WORK_DIR/runtime/wine-11.19-macos-x86_64.tar.gz"
          curl -fsSL --retry 3 -o "$WORK_DIR/sample.tar.xz" "$SAMPLE_URL"
          curl -fsSL --retry 3 -o "$WORK_DIR/sample.tar.xz.sha256" "$SAMPLE_URL.sha256"
          echo "$(cut -d' ' -f1 "$WORK_DIR/sample.tar.xz.sha256")  $WORK_DIR/sample.tar.xz" | shasum -a 256 -c -
          mkdir -p "$WORK_DIR/game"
          tar -xJf "$WORK_DIR/sample.tar.xz" -C "$WORK_DIR/game"
          rm -f "$WORK_DIR/sample.tar.xz"
          x86_64-w64-mingw32-gcc -O2 -Wall -municode scripts/launcher_click.c -o "$WORK_DIR/launcher_click.exe"
          df -h "$RUNNER_TEMP"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Launcher -> Play -> Unity (never fails the job)
        continue-on-error: true
        run: |
          if [ "${{ steps.prepare.outcome }}" != success ]; then
            {
              echo '## Endfield launcher test: ⚠️ not run'
              echo
              echo '**Probable reason:** preparation failed (runtime libraries, Wine artifact or sample download/verification). See the step log and dependencies.log in the artifact.'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # screenshots of the CI desktop are embedded in the summary via litterbox (72 h public
          # links), or catbox.moe when the optional CATBOX_USERHASH secret is set
          CATBOX_SCREENSHOTS=1 CATBOX_USERHASH="${{ secrets.CATBOX_USERHASH }}" python3 scripts/run_launcher_smoke.py --work "$WORK_DIR" --wine "$WORK_DIR/wine-install" \
            --game "$WORK_DIR/game" --clicker "$WORK_DIR/launcher_click.exe" || true
      - name: Upload Endfield test logs (no game files)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: endfield-game-smoke
          path: ${{ env.WORK_DIR }}/game-smoke
          retention-days: 3
          if-no-files-found: ignore
