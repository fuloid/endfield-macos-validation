name: Diagnose direct syscalls on macOS

on:
  workflow_dispatch:
    inputs:
      app_run_id:
        description: 'Successful Gryphfield app build to test without rebuilding Wine'
        type: string
        required: true

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Gryphfield-macos
          run-id: ${{ inputs.app_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dist
      - name: Verify and unpack app
        run: |
          cd "$RUNNER_TEMP/dist"
          shasum -a 256 -c Gryphfield-macos.zip.sha256
          ditto -x -k Gryphfield-macos.zip "$RUNNER_TEMP/app"
      - name: Compile standalone probe
        run: |
          brew install mingw-w64 >/dev/null
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -Werror \
            tools/syscall-probe/syscall-probe.c -o "$RUNNER_TEMP/syscall-probe.exe"
      - name: Compare normal and direct syscalls under Rosetta
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          export ENGINE="$RUNNER_TEMP/app/Gryphfield.app/Contents/Resources/engine"
          export WINEPREFIX="$RUNNER_TEMP/probe-prefix" WINEARCH=win64
          export DYLD_FALLBACK_LIBRARY_PATH="$ENGINE/wine/lib/external:/usr/lib"
          export WINEDLLOVERRIDES='mscoree,mshtml,winedbg.exe=;winemenubuilder.exe=d'
          export WINEDEBUG=+seh ROSETTA_ADVERTISE_AVX=1
          trap '"$ENGINE/wine/bin/wineserver" -k || true' EXIT
          "$ENGINE/wine/bin/wine" wineboot -u > "$RUNNER_TEMP/evidence/wineboot.log" 2>&1
          python3 - <<'PY'
          import os, pathlib, subprocess
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "evidence"
          with (out / "probe.log").open("w") as log:
              result = subprocess.run(
                  [os.environ["ENGINE"] + "/wine/bin/wine",
                   os.environ["RUNNER_TEMP"] + "/syscall-probe.exe"],
                  stdout=log, stderr=subprocess.STDOUT, timeout=60)
          print((out / "probe.log").read_text())
          raise SystemExit(result.returncode)
          PY
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: direct-syscall-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 7
