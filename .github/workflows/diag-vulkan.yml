name: Diagnose wined3d Vulkan half window

on:
  workflow_dispatch:
    inputs:
      app_run_id:
        description: 'Run ID of a successful "Build Gryphfield" run (its Gryphfield-macos artifact is tested)'
        type: string
        required: true
      repeats:
        description: 'Launches per variant'
        type: string
        default: '2'
      quadtest_only:
        description: 'Run only the quadtest stage (skip GRYPHLINK launches)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  diag:
    name: wined3d (Vulkan) launcher variants
    runs-on: macos-15
    timeout-minutes: 90
    env:
      STOCK_MVK_URL: https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-macos.tar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Gryphfield-macos
          run-id: ${{ inputs.app_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dist
      - name: Unpack the app and the stock MoltenVK
        run: |
          cd "$RUNNER_TEMP/dist"
          shasum -a 256 -c Gryphfield-macos.zip.sha256
          ditto -x -k Gryphfield-macos.zip "$RUNNER_TEMP/app"
          mkdir -p "$RUNNER_TEMP/stock-mvk"
          curl -fsSL "$STOCK_MVK_URL" | tar -x -C "$RUNNER_TEMP/stock-mvk"
          dylib="$(find "$RUNNER_TEMP/stock-mvk" -path '*dynamic*' -name libMoltenVK.dylib | head -1)"
          lipo "$dylib" -verify_arch x86_64
          echo "STOCK_DYLIB=$dylib" >> "$GITHUB_ENV"
          lipo -info "$dylib"
      - name: Build quadtest.exe
        run: |
          brew install mingw-w64 >/dev/null
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -Werror tools/quadtest/quadtest.c             -o "$RUNNER_TEMP/quadtest.exe" -ld3d11 -ldxguid
      - name: Run the variants (Intel Homebrew hidden)
        run: |
          hide() { for d in /usr/local/opt /usr/local/Cellar; do [ ! -e "$d" ] || sudo mv "$d" "$d.hidden"; done; }
          unhide() { for d in /usr/local/opt /usr/local/Cellar; do [ ! -e "$d.hidden" ] || sudo mv "$d.hidden" "$d"; done; }
          trap unhide EXIT
          hide
          bash scripts/diag-vulkan.sh "$RUNNER_TEMP/app/Gryphfield.app/Contents/Resources/engine" \
              "$STOCK_DYLIB" "$RUNNER_TEMP/diag" "${{ inputs.quadtest_only && '0' || inputs.repeats }}"               "$RUNNER_TEMP/quadtest.exe"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diag-vulkan
          path: |
            ${{ runner.temp }}/diag/*.jsonl
            ${{ runner.temp }}/diag/*.err
            ${{ runner.temp }}/diag/*.log
            ${{ runner.temp }}/diag/*.png
            ${{ runner.temp }}/diag/*.txt
          retention-days: 5
          if-no-files-found: warn
