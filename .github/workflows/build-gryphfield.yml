name: Build Gryphfield.app

# Private app for the owner and friends: the Gryphfield UI (branch gryphfield-ui) with the engine
# (patched Wine, DXMT, patched MoltenVK, GRYPHLINK, helpers) inside. Reuses the Wine build cached
# by "Validate Wine on macOS"; run that first after changing patches or build-mac.sh.
'on':
  workflow_dispatch:
    inputs:
      ui_ref:
        description: 'Branch or commit of the Gryphfield UI'
        type: string
        default: gryphfield-ui

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: gryphfield-app
  cancel-in-progress: false

env:
  # DXMT v0.80 (589adb78) built by "Build DXMT (experiment)" with tools/dxmt/*.patch, frozen on R2.
  # DXMT_LABEL is the tarball's top directory.
  DXMT_VERSION: v0.80-gryphfield-1
  DXMT_LABEL: dxmt-589adb780354-gryphfield
  DXMT_URL: https://s.purin.my/akef/dxmt-v0.80-gryphfield-1.tar.xz
  DXMT_SHA256: acb8fbc0933fb63632bf9ad01249589c09004fbb3b8738a5c3c0324490743831
  GRYPHLINK_URL: https://s.purin.my/akef/gryphlink-launcher.tar.xz
  STOCK_MVK_URL: https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-macos.tar
  STOCK_MVK_SHA256: f95765a6229cb7b915990a2890ce12ebe36a730b021545d3d52ae69ce4c4024e
  GRYPHLINK_SHA256: 8d400eab612bc479271ca74f2e736d614bdb3cf1d4bee90536ca92ec5afb6c20
  NATIVE_SDK_TAG: v0.11.0
  NATIVE_SDK_COMMIT: 16f29572307c2cc133907537c4dfd98046d4e0f4
  NATIVE_SDK_PATH: ${{ github.workspace }}/../native-sdk
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'

jobs:
  moltenvk:
    name: Patched MoltenVK 1.4.2 (x86_64)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Restore MoltenVK build
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/mvk/moltenvk-out
          key: moltenvk-v1-${{ hashFiles('port/mac-handoff/patches/moltenvk/**', 'port/mac-handoff/scripts/build-moltenvk.sh') }}
      - name: Build MoltenVK with FineWine's patches
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          BUILD_DIR: ${{ runner.temp }}/mvk
        run: |
          xcodebuild -version
          bash port/mac-handoff/scripts/build-moltenvk.sh all || { tail -60 "$BUILD_DIR"/moltenvk-*.log; exit 1; }
      - name: Save MoltenVK build
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/mvk/moltenvk-out
          key: moltenvk-v1-${{ hashFiles('port/mac-handoff/patches/moltenvk/**', 'port/mac-handoff/scripts/build-moltenvk.sh') }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moltenvk-patched
          path: ${{ runner.temp }}/mvk/moltenvk-out
          retention-days: 3

  app:
    name: Assemble, test and package Gryphfield.app
    needs: moltenvk
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Restore the Wine build from "Validate Wine on macOS"
        id: wine
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/wine-validation/wine-install
          key: wine-install-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('port/mac-handoff/patches/**', 'port/mac-handoff/build-mac.sh', 'scripts/ci-macos-deps.sh') }}
      - name: Require the cached Wine build
        run: |
          if [ "${{ steps.wine.outputs.cache-hit }}" != true ]; then
            echo '::error::No cached Wine build for these patches. Run "Validate Wine on macOS" first.'
            exit 1
          fi
          test -d "$RUNNER_TEMP/wine-validation/wine-install/lib/external"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: moltenvk-patched
          path: ${{ runner.temp }}/moltenvk
      - name: Fetch DXMT and GRYPHLINK (pinned hashes)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o dxmt.tar.xz "$DXMT_URL"
          echo "$DXMT_SHA256  dxmt.tar.xz" | shasum -a 256 -c
          mkdir dxmt && tar -xJf dxmt.tar.xz -C dxmt
          curl -fsSL -o gryphlink.tar.xz "$GRYPHLINK_URL"
          echo "$GRYPHLINK_SHA256  gryphlink.tar.xz" | shasum -a 256 -c
          mkdir gryphlink && tar -xJf gryphlink.tar.xz -C gryphlink
          curl -fsSL -o stock-mvk.tar "$STOCK_MVK_URL"
          echo "$STOCK_MVK_SHA256  stock-mvk.tar" | shasum -a 256 -c
          mkdir stock-mvk && tar -xf stock-mvk.tar -C stock-mvk
          ls dxmt/*/ gryphlink/GRYPHLINK stock-mvk/MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib
      - name: Build the helpers
        run: |
          set -euo pipefail
          brew install mingw-w64 >/dev/null
          mkdir -p "$RUNNER_TEMP/tools" "$RUNNER_TEMP/test-tools"
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -Werror -municode engine/tools/gryphfield-watch.c \
            -o "$RUNNER_TEMP/tools/gryphfield-watch.exe"
          x86_64-w64-mingw32-gcc -O2 -Wall -municode -mwindows engine/tools/direct-launch.c \
            -o "$RUNNER_TEMP/tools/direct-launch.exe"
          # Discord Rich Presence: the Windows pipe end and the native relay (arm64 and x86_64)
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -Werror -municode engine/tools/discord-bridge.c \
            -o "$RUNNER_TEMP/tools/discord-bridge.exe" -lws2_32
          clang -O2 -Wall -Wextra -Werror -arch arm64 -arch x86_64 -mmacosx-version-min=11.0 \
            engine/tools/gryphfield-discord.c -o "$RUNNER_TEMP/tools/gryphfield-discord"
          lipo -info "$RUNNER_TEMP/tools/gryphfield-discord"
          # test only, not shipped
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -Werror tools/discord-pipe-probe/discord-pipe-probe.c \
            -o "$RUNNER_TEMP/test-tools/discord-pipe-probe.exe"
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -Werror engine/tests/profile-fixture.c \
            -o "$RUNNER_TEMP/test-tools/Endfield.exe"
      - name: Assemble the engine
        env:
          WINE_INSTALL: ${{ runner.temp }}/wine-validation/wine-install
          DXMT_DIR: ${{ runner.temp }}/dxmt/${{ env.DXMT_LABEL }}
          MVK_DIR: ${{ runner.temp }}/moltenvk
          STOCK_MVK_DYLIB: ${{ runner.temp }}/stock-mvk/MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib
          GRYPHLINK_DIR: ${{ runner.temp }}/gryphlink/GRYPHLINK
          TOOLS_DIR: ${{ runner.temp }}/tools
        run: PATCH_COMMIT="$(git rev-parse --short HEAD)" bash engine/assemble.sh "$RUNNER_TEMP/engine"
      - name: CPU profiling acceptance (harmless Wine fixture, real macOS sampler)
        run: |
          set -euo pipefail
          bash engine/tests/profile-target.sh
          python3 engine/tests/ci-profile.py "$RUNNER_TEMP/engine" "$RUNNER_TEMP/cpu-profile" "$RUNNER_TEMP/test-tools/Endfield.exe"
      - name: Upload CPU profiling evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gryphfield-cpu-profile
          path: |
            ${{ runner.temp }}/cpu-profile/*.jsonl
            ${{ runner.temp }}/cpu-profile/*.err
            ${{ runner.temp }}/cpu-profile/*.log
            ${{ runner.temp }}/cpu-profile/*.txt
            ${{ runner.temp }}/cpu-profile/logs
          retention-days: 7
          if-no-files-found: warn
      # Intel Homebrew is hidden so the test proves the engine is self-contained.
      - name: Smoke-test the engine (Intel Homebrew hidden)
        run: |
          hide() { for d in /usr/local/opt /usr/local/Cellar; do [ ! -e "$d" ] || sudo mv "$d" "$d.hidden"; done; }
          unhide() { for d in /usr/local/opt /usr/local/Cellar; do [ ! -e "$d.hidden" ] || sudo mv "$d.hidden" "$d"; done; }
          trap unhide EXIT
          hide
          bash engine/ci-smoke.sh "$RUNNER_TEMP/engine" "$RUNNER_TEMP/smoke" "$RUNNER_TEMP/test-tools"
      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gryphfield-smoke
          path: |
            ${{ runner.temp }}/smoke/*.jsonl
            ${{ runner.temp }}/smoke/*.err
            ${{ runner.temp }}/smoke/*.log
            ${{ runner.temp }}/smoke/*.png
            ${{ runner.temp }}/smoke/logs
          retention-days: 3
          if-no-files-found: warn
      - name: Check out the UI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ui_ref }}
          path: ui
          persist-credentials: false
      # Same toolchain as the Native SDK's own CI and its scaffolded app CI: Zig 0.16.0, Node 24,
      # the SDK checkout with packages/core installed (the TypeScript core compiler), and the CLI
      # built from that checkout. Running the SDK from a git checkout rather than node_modules also
      # avoids Node refusing to strip TypeScript inside node_modules.
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1
        with:
          version: 0.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Fetch and build Native SDK ${{ env.NATIVE_SDK_TAG }}
        run: |
          set -euo pipefail
          git init -q "$NATIVE_SDK_PATH"
          git -C "$NATIVE_SDK_PATH" fetch -q --depth 1 https://github.com/vercel-labs/native.git "$NATIVE_SDK_COMMIT"
          git -C "$NATIVE_SDK_PATH" checkout -q FETCH_HEAD
          npm ci --prefix "$NATIVE_SDK_PATH/packages/core"
          (cd "$NATIVE_SDK_PATH" && zig build)
          "$NATIVE_SDK_PATH/zig-out/bin/native" --version || true
      - name: Build the Gryphfield UI app
        working-directory: ui/gryphfield
        run: |
          set -euo pipefail
          native="$NATIVE_SDK_PATH/zig-out/bin/native"
          zig version
          "$native" check
          "$native" test --yes
          "$native" build   # the app binary and its service host (zig-out/bin)
          ls -la zig-out/bin
          "$native" package --target macos --signing none
          app="$(find . -name '*.app' -type d -prune -not -path './node_modules/*' | head -1)"
          test -n "$app" || { echo 'no .app produced'; exit 1; }
          ls -la "$app/Contents/MacOS"
          file "$app/Contents/MacOS"/* | grep -q 'Mach-O' || { echo 'the package has no app executable'; exit 1; }
          echo "APP_SRC=$PWD/$app" >> "$GITHUB_ENV"
          echo "Built $app"
      - name: Embed the engine and sign ad hoc
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          app="$RUNNER_TEMP/dist/Gryphfield.app"
          ditto "$APP_SRC" "$app"
          ditto "$RUNNER_TEMP/engine" "$app/Contents/Resources/engine"
          UI_COMMIT="$(git -C ui rev-parse HEAD)" ENGINE_COMMIT="$(git rev-parse HEAD)" python3 - "$app/Contents/Resources/BUILD.json" <<'PY'
          import json, os, sys
          with open(sys.argv[1], "w") as f:
              json.dump({"engine_commit": os.environ["ENGINE_COMMIT"], "ui_commit": os.environ["UI_COMMIT"]}, f)
              f.write("\n")
          PY
          test -s "$app/Contents/Resources/engine/bin/gryphfield-profile"
          # x86_64 Mach-O files are unsigned by default; sign each before sealing the bundle
          find "$app/Contents/Resources/engine" -type f -perm -u+x -o -type f \( -name '*.so' -o -name '*.dylib' \) \
            | while IFS= read -r f; do
                if file -b "$f" | grep -q 'Mach-O'; then codesign --force --sign - "$f" >/dev/null 2>&1 || echo "could not sign $f"; fi
              done
          codesign --force --sign - "$app"
          codesign --verify --strict --verbose=2 "$app"
          cd "$RUNNER_TEMP/dist"
          ditto -c -k --sequesterRsrc --keepParent Gryphfield.app Gryphfield-macos.zip
          shasum -a 256 Gryphfield-macos.zip | tee Gryphfield-macos.zip.sha256
          {
            echo '## Gryphfield.app'
            echo "- engine: $(cat "$app/Contents/Resources/engine/VERSION.json")"
            echo "- app size: $(du -sh "$app" | cut -f1); zip: $(du -sh Gryphfield-macos.zip | cut -f1)"
            echo "- sha256: $(cut -d' ' -f1 Gryphfield-macos.zip.sha256)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Capture the packaged UI (best effort on the CI VM)
        continue-on-error: true
        run: |
          ditto "$RUNNER_TEMP/dist/Gryphfield.app" /Applications/Gryphfield.app
          open /Applications/Gryphfield.app
          sleep 5
          screencapture -x "$RUNNER_TEMP/smoke/ui-main.png"
          osascript <<'APPLESCRIPT'
          tell application "System Events"
            tell process "Gryphfield"
              click button "Settings" of window 1
            end tell
          end tell
          APPLESCRIPT
          sleep 2
          screencapture -x "$RUNNER_TEMP/smoke/ui-settings.png"
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gryphfield-ui-screenshots
          path: ${{ runner.temp }}/smoke/ui-*.png
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Gryphfield-macos
          path: |
            ${{ runner.temp }}/dist/Gryphfield-macos.zip
            ${{ runner.temp }}/dist/Gryphfield-macos.zip.sha256
          retention-days: 7
          compression-level: 0
