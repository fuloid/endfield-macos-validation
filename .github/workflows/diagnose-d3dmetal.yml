name: Diagnose D3DMetal thread initialization

'on':
  workflow_call:
    inputs:
      ntdll_variant:
        type: boolean
        default: true
      baseline_app_run_id:
        type: string
        default: '39913002430'
      wine_cache_key:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ntdll_variant:
        description: 'Test the experimental Wine 11.19 native-TSD ntdll cache (no app packaging)'
        type: boolean
        default: false
      baseline_app_run_id:
        description: 'Wine 11.19 app artifact to compare with CrossOver'
        type: string
        default: '39913002430'
        required: true
      wine_cache_key:
        description: 'Exact full CrossOver install cache; rebuild with validate-crossover.yml if evicted'
        type: string
        default: 'crossover-install-v1-macOS-ARM64-901a34458ac13190c6f2c798aa9ab5119222fd90ae90c117ff5efb92cb2b82e7'
        required: true

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  compare:
    if: ${{ !inputs.ntdll_variant }}
    runs-on: macos-15
    timeout-minutes: 40
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      D3DMETAL_VERSION: 4.0b3-gryphfield-1
      D3DMETAL_LABEL: d3dmetal-4.0b3
      D3DMETAL_URL: https://s.purin.my/akef/d3dmetal-4.0b3-gryphfield-1.tar.xz
      D3DMETAL_SHA256: 5243f4c000b4235096a5c1a9d2891b5ceffc315000d35e198a8f8352a195f7f0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record environment
        run: |
          mkdir -p "$RUNNER_TEMP/d3dmetal-ab/evidence"
          { sw_vers; uname -a; xcodebuild -version; git rev-parse HEAD; } > "$RUNNER_TEMP/d3dmetal-ab/evidence/environment.txt"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: wine
        with:
          path: ${{ runner.temp }}/crossover-experimental/wine-install
          key: ${{ inputs.wine_cache_key }}
      - name: Require the full matching CrossOver install
        run: |
          test '${{ steps.wine.outputs.cache-hit }}' = true
          cmp port/crossover-experimental/sources.lock.json "$RUNNER_TEMP/crossover-experimental/wine-install/sources.lock.json"
          cp "$RUNNER_TEMP/crossover-experimental/wine-install/BUILD-INFO.txt" "$RUNNER_TEMP/d3dmetal-ab/evidence/crossover-build.txt"
          nm -gU "$RUNNER_TEMP/crossover-experimental/wine-install/lib/wine/x86_64-unix/winemac.so" | grep ' _macdrv_functions$'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Gryphfield-macos
          run-id: ${{ inputs.baseline_app_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline-download
      - name: Verify app and pinned graphics payloads
        run: |
          (cd "$RUNNER_TEMP/baseline-download" && shasum -a 256 -c Gryphfield-macos.zip.sha256)
          ditto -x -k "$RUNNER_TEMP/baseline-download/Gryphfield-macos.zip" "$RUNNER_TEMP/baseline-app"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/d3dmetal.tar.xz" "$D3DMETAL_URL"
          echo "$D3DMETAL_SHA256  $RUNNER_TEMP/d3dmetal.tar.xz" | shasum -a 256 -c
          mkdir "$RUNNER_TEMP/d3dmetal"
          tar -xJf "$RUNNER_TEMP/d3dmetal.tar.xz" -C "$RUNNER_TEMP/d3dmetal"
          base="$RUNNER_TEMP/baseline-app/Gryphfield.app/Contents/Resources/engine/wine-d3dmetal/lib"
          payload="$RUNNER_TEMP/d3dmetal/$D3DMETAL_LABEL"
          # App packaging re-signs Mach-O images; PE DLLs still compare byte for byte.
          dwarfdump --uuid "$base/external/libd3dshared.dylib" "$payload/external/libd3dshared.dylib" \
            > "$RUNNER_TEMP/d3dmetal-ab/evidence/d3dmetal-images.txt"
          for dll in dxgi d3d11; do
            cmp "$base/wine/x86_64-windows/$dll.dll" "$payload/x86_64-windows/$dll.dll"
          done
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/dxmt.tar.gz" https://github.com/3Shain/dxmt/releases/download/v0.80/dxmt-v0.80-builtin.tar.gz
          echo "8f260e36b5739e68f3bad613381441385c4dc7b85b78ba8de653d5a6a264529d  $RUNNER_TEMP/dxmt.tar.gz" | shasum -a 256 -c
          mkdir "$RUNNER_TEMP/dxmt"
          tar -xzf "$RUNNER_TEMP/dxmt.tar.gz" -C "$RUNNER_TEMP/dxmt"
      - name: Build spawn probe
        run: |
          brew install mingw-w64 >/dev/null
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -Werror engine/tests/spawn-probe.c \
            -o "$RUNNER_TEMP/d3dmetal-ab/spawn-probe.exe" -ldxguid
      - name: Assemble full CrossOver engine with D3DMetal
        env:
          WINE_INSTALL: ${{ runner.temp }}/crossover-experimental/wine-install
          D3DMETAL_DIR: ${{ runner.temp }}/d3dmetal/${{ env.D3DMETAL_LABEL }}
        run: |
          # The older CrossOver wrapper expects native helpers beside the PE helpers.
          base="$RUNNER_TEMP/baseline-app/Gryphfield.app/Contents/Resources/engine"
          for helper in gryphfield-discord gryphfield-hud; do
            ln -s "../bin/$helper" "$base/tools/$helper"
          done
          bash port/crossover-experimental/assemble.sh \
            "$base" \
            "$RUNNER_TEMP/dxmt/v0.80" "$RUNNER_TEMP/d3dmetal-ab/crossover-engine"
      - name: Compare thread initialization (informational)
        run: |
          python3 engine/tests/ci-d3dmetal-ab.py \
            "$RUNNER_TEMP/baseline-app/Gryphfield.app/Contents/Resources/engine" \
            "$RUNNER_TEMP/d3dmetal-ab/crossover-engine" \
            "$RUNNER_TEMP/d3dmetal-ab/spawn-probe.exe" "$RUNNER_TEMP/d3dmetal-ab/evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: d3dmetal-ab-evidence
          path: ${{ runner.temp }}/d3dmetal-ab/evidence
          retention-days: 7

  ntdll-variant:
    if: inputs.ntdll_variant
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record environment
        run: |
          mkdir -p "$RUNNER_TEMP/ntdll-variant/evidence"
          { sw_vers; uname -a; xcodebuild -version; git rev-parse HEAD; } > "$RUNNER_TEMP/ntdll-variant/evidence/environment.txt"
      - name: Restore the full Wine build and experimental ntdll pair
        id: wine
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/wine-validation/wine-install
          key: wine-install-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('port/mac-handoff/patches/**', 'port/mac-handoff/patches-d3dmetal/**', 'port/mac-handoff/build-mac.sh', 'scripts/ci-macos-deps.sh') }}
      - name: Require the matched experimental pair
        run: |
          test '${{ steps.wine.outputs.cache-hit }}' = true
          variant="$RUNNER_TEMP/wine-validation/wine-install/lib/wine-d3dmetal-ntdll"
          (cd "$variant" && shasum -a 256 -c SHA256SUMS)
          cp "$variant/SHA256SUMS" "$RUNNER_TEMP/ntdll-variant/evidence/variant-SHA256SUMS"
          nm -a "$variant/x86_64-unix/ntdll.so" | grep mac_localtime \
            > "$RUNNER_TEMP/ntdll-variant/evidence/variant-localtime-symbol.txt"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Gryphfield-macos
          run-id: ${{ inputs.baseline_app_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline-download
      - name: Reuse the baseline app's graphics payloads, launcher and helpers
        run: |
          (cd "$RUNNER_TEMP/baseline-download" && shasum -a 256 -c Gryphfield-macos.zip.sha256)
          ditto -x -k "$RUNNER_TEMP/baseline-download/Gryphfield-macos.zip" "$RUNNER_TEMP/baseline-app"
          base="$RUNNER_TEMP/baseline-app/Gryphfield.app/Contents/Resources/engine"
          stage="$RUNNER_TEMP/ntdll-variant"
          mkdir -p "$stage/tools" "$stage/dxmt/x86_64-unix" "$stage/dxmt/x86_64-windows"
          cp "$base/tools/gryphfield-watch.exe" "$base/tools/direct-launch.exe" "$base/tools/discord-bridge.exe" "$stage/tools/"
          cp "$base/bin/gryphfield-discord" "$base/bin/gryphfield-hud" "$stage/tools/"
          for name in d3d11 dxgi d3d10core winemetal; do
            for arch in x86_64-unix x86_64-windows; do
              if [ "$arch" = x86_64-unix ]; then suffix=so; else suffix=dll; fi
              src="$base/wine-dxmt/lib/wine/$arch/$name.$suffix"
              [ ! -f "$src" ] || cp -pL "$src" "$stage/dxmt/$arch/"
            done
          done
          mkdir -p "$stage/d3dmetal/x86_64-windows" "$stage/d3dmetal/external/D3DMetal.framework/Versions"
          cp "$base/wine-d3dmetal/lib/wine/x86_64-windows/"{d3d11,dxgi}.dll "$stage/d3dmetal/x86_64-windows/"
          cp "$base/wine-d3dmetal/lib/external/libd3dshared.dylib" "$stage/d3dmetal/external/"
          cp -RP "$base/wine-d3dmetal/lib/external/D3DMetal.framework/Versions/A" \
            "$stage/d3dmetal/external/D3DMetal.framework/Versions/"
          cp "$base/VERSION.json" "$stage/evidence/baseline-VERSION.json"
      - name: Build diagnostic fixtures
        run: |
          brew install mingw-w64 >/dev/null
          tools="$RUNNER_TEMP/ntdll-variant/test-tools"
          mkdir -p "$tools"
          x86_64-w64-mingw32-gcc -O2 -static -Wall -Wextra -Werror engine/tests/teb-probe.c -o "$tools/teb-probe.exe"
          x86_64-w64-mingw32-gcc -O2 -shared -Wall -Wextra -Werror engine/tests/teb-tls.c -o "$tools/teb-tls.dll"
          x86_64-w64-mingw32-gcc -O2 -static -Wall -Wextra -Werror tools/syscall-probe/syscall-probe.c -o "$tools/syscall-probe.exe"
          x86_64-w64-mingw32-gcc -O2 -static -Wall -Wextra -Werror port/mac-handoff/rosetta_probe.c -o "$tools/rosetta-probe.exe"
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -Werror engine/tests/spawn-probe.c -o "$tools/spawn-probe.exe" -ldxguid
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -Werror engine/tests/d3d11-probe.c -o "$tools/d3d11-probe.exe" -ld3d11 -ldxguid
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -Werror tools/discord-pipe-probe/discord-pipe-probe.c -o "$tools/discord-pipe-probe.exe"
          clang -O2 -Wall -Wextra -Werror -arch x86_64 engine/tests/framework-probe.c -o "$tools/framework-probe"
      - name: Assemble a CI-only engine with the experimental pair
        id: assemble
        env:
          WINE_INSTALL: ${{ runner.temp }}/wine-validation/wine-install
        run: |
          base="$RUNNER_TEMP/baseline-app/Gryphfield.app/Contents/Resources/engine"
          stage="$RUNNER_TEMP/ntdll-variant"
          DXMT_DIR="$stage/dxmt" D3DMETAL_DIR="$stage/d3dmetal" MVK_DIR="$base/moltenvk" \
            STOCK_MVK_DYLIB="$base/moltenvk-stock/libMoltenVK.dylib" \
            GRYPHLINK_DIR="$base/gryphlink/GRYPHLINK" TOOLS_DIR="$stage/tools" \
            PATCH_COMMIT="$(git rev-parse --short HEAD)" bash engine/assemble.sh "$stage/engine"
          test -f "$stage/engine/wine-d3dmetal/EXPERIMENTAL-D3DMETAL-NTDLL.txt"
      - name: Check TEB/TLS/SEH, direct syscalls and D3DMetal thread initialization
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        run: |
          python3 -I engine/tests/ci-ntdll-variant.py "$RUNNER_TEMP/ntdll-variant/engine" \
            "$RUNNER_TEMP/ntdll-variant/test-tools" "$RUNNER_TEMP/ntdll-variant/evidence/probes"
      - name: Upload focused probe evidence before the launcher smoke suite
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: d3dmetal-ntdll-probe-evidence
          path: |
            ${{ runner.temp }}/ntdll-variant/evidence/*.txt
            ${{ runner.temp }}/ntdll-variant/evidence/*.json
            ${{ runner.temp }}/ntdll-variant/evidence/variant-SHA256SUMS
            ${{ runner.temp }}/ntdll-variant/evidence/probes/*.json
            ${{ runner.temp }}/ntdll-variant/evidence/probes/*.txt
            ${{ runner.temp }}/ntdll-variant/evidence/probes/*.log
            ${{ runner.temp }}/ntdll-variant/evidence/probes/wine/*.log
            ${{ runner.temp }}/ntdll-variant/evidence/probes/wine-dxmt/*.log
            ${{ runner.temp }}/ntdll-variant/evidence/probes/wine-d3dmetal/*.log
            ${{ runner.temp }}/ntdll-variant/evidence/probes/graphics-logs
            ${{ runner.temp }}/ntdll-variant/evidence/probes/crashes-*
          retention-days: 7
      - name: Run the unchanged engine smoke suite (Intel Homebrew hidden)
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        run: |
          hide() { for d in /usr/local/opt /usr/local/Cellar; do [ ! -e "$d" ] || sudo mv "$d" "$d.hidden"; done; }
          unhide() { for d in /usr/local/opt /usr/local/Cellar; do [ ! -e "$d.hidden" ] || sudo mv "$d.hidden" "$d"; done; }
          trap unhide EXIT
          hide
          bash engine/ci-smoke.sh "$RUNNER_TEMP/ntdll-variant/engine" \
            "$RUNNER_TEMP/ntdll-variant/evidence/smoke" "$RUNNER_TEMP/ntdll-variant/test-tools"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: d3dmetal-ntdll-variant-evidence
          path: |
            ${{ runner.temp }}/ntdll-variant/evidence/*.txt
            ${{ runner.temp }}/ntdll-variant/evidence/*.json
            ${{ runner.temp }}/ntdll-variant/evidence/variant-SHA256SUMS
            ${{ runner.temp }}/ntdll-variant/evidence/probes/*.json
            ${{ runner.temp }}/ntdll-variant/evidence/probes/*.txt
            ${{ runner.temp }}/ntdll-variant/evidence/probes/*.log
            ${{ runner.temp }}/ntdll-variant/evidence/probes/wine/*.log
            ${{ runner.temp }}/ntdll-variant/evidence/probes/wine-dxmt/*.log
            ${{ runner.temp }}/ntdll-variant/evidence/probes/wine-d3dmetal/*.log
            ${{ runner.temp }}/ntdll-variant/evidence/probes/graphics-logs
            ${{ runner.temp }}/ntdll-variant/evidence/probes/crashes-*
            ${{ runner.temp }}/ntdll-variant/evidence/smoke/*.jsonl
            ${{ runner.temp }}/ntdll-variant/evidence/smoke/*.json
            ${{ runner.temp }}/ntdll-variant/evidence/smoke/*.txt
            ${{ runner.temp }}/ntdll-variant/evidence/smoke/*.log
            ${{ runner.temp }}/ntdll-variant/evidence/smoke/*.err
            ${{ runner.temp }}/ntdll-variant/evidence/smoke/*.png
            ${{ runner.temp }}/ntdll-variant/evidence/smoke/logs
          retention-days: 7
